{{- $site := resources.Get "js/site/site.js" | js.Build (dict "targetPath" "assets/js/site.js") | resources.Minify -}}
{{- if not site.Params.assets.disableFingerprinting }}
{{- $site = $site | fingerprint }}
<script defer crossorigin="anonymous" src="{{ $site.RelPermalink }}" integrity="{{ $site.Data.Integrity }}"></script>
{{- else }}
<script defer crossorigin="anonymous" src="{{ $site.RelPermalink }}"></script>
{{- end }}
